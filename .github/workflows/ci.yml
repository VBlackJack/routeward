name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  frontend:
    name: UI Build, Tests, and Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Advisories exempted by name, with a review date, live in ui/audit-exceptions.json.
      - run: node scripts/audit.mjs

  rust-linux:
    name: Rust Check, Clippy, and Tests (Linux)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-windows:
    name: Rust Check, Clippy, and Tests (Windows)
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Smoke build of the MSI (no WinDivert) so a broken RouteWard.wxs fails CI instead of the release.
      - name: Build MSI (smoke)
        shell: pwsh
        run: |
          cargo build --workspace --locked
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2
          ./packaging/windows/build-msi.ps1 -TargetDir target/debug -OutDir "$env:RUNNER_TEMP/msi-smoke"

  rust-msrv:
    name: Rust MSRV Check (1.89, core and cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Keep the toolchain below in sync with `rust-version` in the workspace Cargo.toml.
      # Only core and cli are checked: the desktop crate needs the GTK/WebKit system
      # libraries and the built ui/dist, which this job deliberately avoids.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-toolchain.toml pins "stable" and would override the default toolchain set by the
      # action, so the toolchain is selected explicitly here.
      - run: cargo +1.89 --version && rustc +1.89 --version
      - run: cargo +1.89 check -p routeward-core -p routeward-cli --locked

  rust-audit:
    name: Rust Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  linux-integration:
    name: Linux Netfilter & Dual-Stack Integration (Docker)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Load kernel modules for nftables and TPROXY
        run: |
          sudo modprobe nf_tables nf_nat nf_conntrack xt_TPROXY ip6_tables || true
      - name: Build Linux integration test image
        run: docker build -f tests/linux/Dockerfile -t routeward-linux-test .
      - name: Run Linux container integration suite with IPv6 enabled
        run: |
          docker run --rm --privileged \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv6.conf.default.disable_ipv6=0 \
            routeward-linux-test
