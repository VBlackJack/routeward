name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional version label when running manually"
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Creates (or reuses) a draft release. On tag runs no workflow artifact storage
  # is used: build jobs hand their files to publish-release through the Actions
  # cache, and only publish-release holds a write token.
  draft-release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/${TAG}.md"
          notes_args=(--generate-notes)
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi

          status=0
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2> "$RUNNER_TEMP/view.err" > "$RUNNER_TEMP/view.json" || status=$?
          if [ "$status" -eq 0 ]; then
            if [ "$(jq -r '.isDraft' "$RUNNER_TEMP/view.json")" != "true" ]; then
              echo "Release $TAG is already published; refusing to modify it." >&2
              exit 1
            fi
            # Reuse of a draft: drop every previous asset so stale files from an
            # earlier attempt can never be published.
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              gh release delete-asset "$TAG" "$name" --yes --repo "$GITHUB_REPOSITORY"
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if [ -f "$notes_file" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file "$notes_file"
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG"
            fi
          elif grep -qi 'release not found' "$RUNNER_TEMP/view.err"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" "${notes_args[@]}"
          else
            echo "Unable to look up release $TAG:" >&2
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi

  linux-deb:
    needs: draft-release
    if: ${{ !cancelled() && (needs.draft-release.result == 'success' || needs.draft-release.result == 'skipped') }}
    # The binaries link against the build host's glibc: build on the oldest supported baseline
    # (Ubuntu 22.04, glibc 2.35) so they run on Debian 12 (glibc 2.36) without loader warnings.
    runs-on: ubuntu-22.04
    env:
      GLIBC_FLOOR: "2.35"
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build Linux release binaries
        run: cargo build --release --workspace --locked

      - name: Check the glibc floor of the binaries
        run: bash packaging/linux/check-glibc-floor.sh --max "$GLIBC_FLOOR" target/release/routeward target/release/routeward-desktop

      - name: Build Debian package
        run: bash packaging/linux/build-deb.sh --target-dir target/release --out-dir dist

      - name: Upload Debian package as workflow artifact (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-deb
          retention-days: 3
          path: |
            dist/*.deb
            dist/*.deb.sha256

      # Tag runs: hand the files to publish-release through the Actions cache.
      # The key has no run_attempt so a "re-run failed jobs" attempt still finds
      # the files of a build job that succeeded in an earlier attempt. The lookup
      # makes the save idempotent when a successful build job is rerun.
      - name: Check for an existing release cache
        id: existing
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/*.deb
            dist/*.deb.sha256
          key: release-${{ github.run_id }}-linux
          lookup-only: true

      - name: Save release files for the publish job
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.existing.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/*.deb
            dist/*.deb.sha256
          key: release-${{ github.run_id }}-linux

  windows-zip:
    needs: draft-release
    if: ${{ !cancelled() && (needs.draft-release.result == 'success' || needs.draft-release.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # WinDivert 2.2.2 corresponding source (LGPLv3 obligation for the DLL and driver shipped in the MSI).
      # The binary archive is pinned inside tools/fetch-windivert.ps1.
      WINDIVERT_SOURCE_URL: https://github.com/basil00/WinDivert/archive/refs/tags/v2.2.2.tar.gz
      WINDIVERT_SOURCE_SHA256: 300c1b14e08652e0f8647bf06e9b212f924af76cb2459bd0f88da481c9b08336
      WINDIVERT_SOURCE_NAME: WinDivert-2.2.2-source.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build Windows release binaries
        run: cargo build --release --workspace --locked

      - name: Setup WiX Toolset CLI
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2

      # Pinned SHA-256 of WinDivert-2.2.2-A.zip is enforced by the script. It extracts the unmodified
      # x64 DLL and driver plus the upstream license texts into third_party/windivert/bin.
      - name: Fetch WinDivert runtime and license files
        shell: pwsh
        run: ./tools/fetch-windivert.ps1

      - name: Package Windows bundle and MSI installer
        shell: pwsh
        run: |
          ./packaging/windows/package-windows.ps1 -TargetDir target/release -OutDir dist -Arch x64
          ./packaging/windows/build-msi.ps1 -TargetDir target/release -OutDir dist -Arch x64 -IncludeWinDivert

      - name: Download WinDivert corresponding source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $target = Join-Path dist $env:WINDIVERT_SOURCE_NAME
          Invoke-WebRequest -Uri $env:WINDIVERT_SOURCE_URL -OutFile $target -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:WINDIVERT_SOURCE_SHA256) {
            Remove-Item -LiteralPath $target -Force
            throw "SHA-256 mismatch for WinDivert source archive. Expected $($env:WINDIVERT_SOURCE_SHA256), actual $actual"
          }
          # LF line ending so `sha256sum -c` accepts the sidecar on every platform.
          [System.IO.File]::WriteAllText("$target.sha256", "$actual  $($env:WINDIVERT_SOURCE_NAME)`n", [System.Text.Encoding]::ASCII)

      - name: Upload Windows ZIP and MSI as workflow artifact (manual runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-zip
          retention-days: 3
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      # Tag runs: hand the files to publish-release through the Actions cache.
      # The key has no run_attempt so a "re-run failed jobs" attempt still finds
      # the files of a build job that succeeded in an earlier attempt. The lookup
      # makes the save idempotent when a successful build job is rerun.
      - name: Check for an existing release cache
        id: existing
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          key: release-${{ github.run_id }}-windows
          lookup-only: true
          enableCrossOsArchive: true

      - name: Save release files for the publish job
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.existing.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          key: release-${{ github.run_id }}-windows
          enableCrossOsArchive: true

  publish-release:
    needs: [linux-deb, windows-zip]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Restore Linux release files
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/*.deb
            dist/*.deb.sha256
          key: release-${{ github.run_id }}-linux
          fail-on-cache-miss: true

      - name: Restore Windows release files
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          key: release-${{ github.run_id }}-windows
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Verify release files
        working-directory: dist
        run: |
          set -euo pipefail
          # Tag v2026.1116.01 maps to Cargo version 2026.1116.1 (the sequence loses its leading zeros).
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag $TAG does not match vYYYY.MMDD.NN" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]}))"
          echo "Expected package version: $version"

          shopt -s nullglob
          debs=(*.deb)
          zips=(*.zip)
          msis=(*.msi)
          sources=(*.tar.gz)
          if [ "${#debs[@]}" -ne 1 ] || [ "${#zips[@]}" -ne 1 ] || [ "${#msis[@]}" -ne 1 ]; then
            echo "Expected exactly one .deb, one .zip and one .msi in dist; found: ${debs[*]} ${zips[*]} ${msis[*]}" >&2
            exit 1
          fi
          if [ "${#sources[@]}" -ne 1 ] || [ "${sources[0]}" != "WinDivert-2.2.2-source.tar.gz" ]; then
            echo "Expected exactly the WinDivert 2.2.2 source archive among .tar.gz files; found: ${sources[*]}" >&2
            exit 1
          fi
          case "${debs[0]}" in *"_${version}_"*) ;; *) echo "${debs[0]} does not carry version $version" >&2; exit 1 ;; esac
          case "${zips[0]}" in *"-${version}-"*) ;; *) echo "${zips[0]} does not carry version $version" >&2; exit 1 ;; esac
          case "${msis[0]}" in *"-${version}-"*) ;; *) echo "${msis[0]} does not carry version $version" >&2; exit 1 ;; esac

          # Sidecars hold "<hash>  <basename>"; verify each against its file.
          for pkg in "${debs[0]}" "${zips[0]}" "${msis[0]}" "${sources[0]}"; do
            if grep -q $'\r' "${pkg}.sha256"; then
              echo "${pkg}.sha256 has CRLF line endings; sidecars must use LF." >&2
              exit 1
            fi
            sha256sum -c "${pkg}.sha256"
          done
          sha256sum "${debs[0]}" "${zips[0]}" "${msis[0]}" "${sources[0]}" > SHA256SUMS.txt

      - name: Upload files to the draft release
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.deb dist/*.deb.sha256 dist/*.zip dist/*.zip.sha256 dist/*.msi dist/*.msi.sha256 dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
