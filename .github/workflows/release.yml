name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional version label when running manually"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ui-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Upload built UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  linux-deb:
    needs: ui-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux release binaries
        run: cargo build --release --workspace

      - name: Build Debian package
        run: bash packaging/linux/build-deb.sh --target-dir target/release --out-dir dist

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-deb
          path: |
            dist/*.deb
            dist/*.deb.sha256

  windows-zip:
    needs: ui-build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release binaries
        run: cargo build --release --workspace

      - name: Setup WiX Toolset CLI
        run: dotnet tool install --global wix --version 6.0.2

      - name: Package Windows bundle and MSI installer
        shell: pwsh
        run: |
          ./packaging/windows/package-windows.ps1 -TargetDir target/release -OutDir dist -Arch x64
          ./packaging/windows/build-msi.ps1 -TargetDir target/release -OutDir dist -Arch x64

      - name: Upload Windows ZIP and MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256

  publish-release:
    needs: [linux-deb, windows-zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare combined release files and SHA256SUMS
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.deb' -o -name '*.zip' -o -name '*.msi' -o -name '*.sha256' \) -exec cp {} release-files/ \;
          (
            cd release-files
            sha256sum *.deb *.zip *.msi > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*.deb
            release-files/*.zip
            release-files/*.msi
            release-files/*.sha256
            release-files/SHA256SUMS.txt
          generate_release_notes: true
