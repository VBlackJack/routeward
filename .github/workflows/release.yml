name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional version label when running manually"
        required: false
        default: ""

permissions: {}

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build Linux release binaries
        run: cargo build --release --workspace --locked

      - name: Build Debian package
        run: bash packaging/linux/build-deb.sh --target-dir target/release --out-dir dist

      - name: Upload Debian package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-deb
          path: |
            dist/*.deb
            dist/*.deb.sha256

  windows-zip:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build Windows release binaries
        run: cargo build --release --workspace --locked

      - name: Setup WiX Toolset CLI
        run: dotnet tool install --global wix --version 6.0.2

      - name: Package Windows bundle and MSI installer
        shell: pwsh
        run: |
          ./packaging/windows/package-windows.ps1 -TargetDir target/release -OutDir dist -Arch x64
          ./packaging/windows/build-msi.ps1 -TargetDir target/release -OutDir dist -Arch x64

      - name: Upload Windows ZIP and MSI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.msi
            dist/*.msi.sha256

  publish-release:
    needs: [linux-deb, windows-zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare combined release files and SHA256SUMS
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.deb' -o -name '*.zip' -o -name '*.msi' -o -name '*.sha256' \) -exec cp {} release-files/ \;
          (
            cd release-files
            sha256sum *.deb *.zip *.msi > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release-files/*.deb
            release-files/*.zip
            release-files/*.msi
            release-files/*.sha256
            release-files/SHA256SUMS.txt
          generate_release_notes: true
